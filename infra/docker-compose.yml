# DeepLog AIOps altyapısı. Portlar, RAM limitleri ve topic ayarları docs/01-mimari.md §4 ve §7 ile aynı tutulur
# (tests/test_compose.py kontrol eder).
name: deeplog

x-spark: &spark
  image: deeplog-spark:4.2.1
  build: images/spark
  environment:
    SPARK_DAEMON_MEMORY: 256m

# Spark sürücüsü (driver) çalıştıran servisler. Depo kökü salt okunur bağlanır; böylece jobs/ ve
# ingestion/ (ortak sözleşmeler) imajı yeniden build etmeden kullanılır. Executor'lar sürücüye IP ile bağlanır.
x-spark-driver: &spark-driver
  image: deeplog-spark:4.2.1
  build: images/spark
  entrypoint: ["/bin/bash", "-c",
               "exec /opt/spark/bin/spark-submit --conf spark.driver.host=$$(hostname -i) \"$$@\"", "--"]
  volumes:
    - ..:/opt/deeplog:ro
  environment:
    PYTHONPATH: /opt/deeplog

services:
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    # init: Java PID 1 olursa içeriden SIGKILL almaz ve zombi süreçleri toplamaz; tini PID 1 olur.
    # restart: süreç çökünce (sıfır olmayan çıkış) Docker yeniden başlatır; elle durdurulunca başlatmaz.
    init: true
    restart: on-failure
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: N8GxR3AGS2OdLe7zlvmPMg
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: konteynerler arası (kafka:29092), EXTERNAL: Windows host'tan (127.0.0.1:9092).
      # localhost değil: istemci önce IPv6 ::1 dener, port yalnızca IPv4'te açık olduğu için 2 sn kaybeder.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Tek seferlik: docs/01-mimari.md §4'teki topic'leri oluşturur (varsa dokunmaz).
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 --config retention.ms="$$3"
        }
        create logs.raw    3 86400000
        create metrics.raw 1 86400000
        create alerts      1 604800000
        create actions     1 604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    mem_limit: 512m

  # Tek seferlik: volume'lar root sahipliğinde oluşur; Hadoop süreçleri uid 1000 ile çalışır.
  hdfs-volume-init:
    image: apache/hadoop:3.4.3
    user: root
    entrypoint: ["chown", "1000:100", "/hadoop/dfs/name", "/hadoop/dfs/data"]
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - hdfs_datanode:/hadoop/dfs/data
    mem_limit: 128m

  namenode:
    image: apache/hadoop:3.4.3
    hostname: namenode
    restart: on-failure
    command: ["hdfs", "namenode"]
    ports:
      - "127.0.0.1:9870:9870"
    env_file: hadoop.env
    environment:
      # Klasör yoksa (ilk açılış) namenode formatlanır; sonraki açılışlarda veri korunur.
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
      HADOOP_HEAPSIZE_MAX: 512m
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
    depends_on:
      hdfs-volume-init:
        condition: service_completed_successfully
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  datanode:
    image: apache/hadoop:3.4.3
    hostname: datanode
    restart: on-failure
    command: ["hdfs", "datanode"]
    ports:
      - "127.0.0.1:9864:9864"
    env_file: hadoop.env
    environment:
      HADOOP_HEAPSIZE_MAX: 512m
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9864/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Tek seferlik: safe mode'dan çıkışı bekler ve docs/01-mimari.md §6'daki kök dizinleri oluşturur.
  hdfs-init:
    image: apache/hadoop:3.4.3
    env_file: hadoop.env
    command:
      - bash
      - -c
      - >-
        hdfs dfsadmin -safemode wait &&
        hdfs dfs -mkdir -p /datalake/raw /datalake/curated /datalake/views /models /checkpoints &&
        hdfs dfs -ls /
    depends_on:
      datanode:
        condition: service_healthy
    mem_limit: 512m

  spark-master:
    <<: *spark
    hostname: spark-master
    init: true
    restart: on-failure
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spark-worker:
    <<: *spark
    hostname: spark-worker
    init: true
    restart: on-failure
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2g", "spark://spark-master:7077"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      spark-master:
        condition: service_healthy
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ING-04: logs.raw -> HDFS raw bölgesi, sürekli çalışan Structured Streaming işi.
  # kafka-init ve hdfs-init'e "başarıyla tamamlandı" koşuluyla bağlıdır; bu, topic'lerin ve dizinlerin
  # hazır olmasını garanti eder ve `docker compose up --wait`in bu tek seferlik servislerin
  # çıkışını hata saymasını önler.
  spark-ingest:
    <<: *spark-driver
    hostname: spark-ingest
    init: true
    restart: on-failure
    command: ["/opt/deeplog/jobs/ingest_raw.py"]
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      spark-worker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4040/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ING-05: Docker API'ye salt okuma erişimi. POST (başlat/durdur/yeniden başlat/exec) kapalı;
  # yalnızca /containers okuma açık. Ajan Docker soketini doğrudan görmez (docs/01-mimari.md §9).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    init: true
    restart: on-failure
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/_ping | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ING-05: projedeki konteynerlerin CPU, bellek, disk G/Ç ve ağ ölçümleri, 5 sn'de bir metrics.raw'a.
  metrics-agent:
    image: deeplog-agent:1
    build: images/agent
    init: true
    restart: on-failure
    command: ["python", "-m", "ingestion.metrics_agent",
              "--docker", "http://socket-proxy:2375", "--bootstrap", "kafka:29092", "--interval", "5"]
    volumes:
      - ..:/opt/deeplog:ro
    depends_on:
      socket-proxy:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 128m
    healthcheck:  # ajan her turda /tmp/heartbeat dosyasına dokunur; 30 sn'den eskiyse sağlıksız
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # İş göndermek için: docker compose --profile jobs run --rm spark-job /opt/deeplog/jobs/<betik>.py
  spark-job:
    <<: *spark-driver
    profiles: ["jobs"]
    depends_on:
      spark-worker:
        condition: service_healthy
      datanode:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 1g

volumes:
  kafka_data:
  hdfs_namenode:
  hdfs_datanode:
